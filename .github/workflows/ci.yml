name: CI - Build & Test Docker Images

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  docker-build:
    name: Build & Test Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: alt-backend:ci-test

      - name: Build Load Worker (Go) Image
        uses: docker/build-push-action@v5
        with:
          context: ./load-worker
          file: ./load-worker/Dockerfile
          push: false
          tags: alt-load-worker:ci-test

      - name: Build Web Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: alt-web:ci-test

      - name: Verify Compose Stack Startup
        run: |
          cp .env.example .env
          docker compose config
          docker compose up -d postgres redis influxdb
          sleep 10
          docker compose ps
          docker compose down -v
